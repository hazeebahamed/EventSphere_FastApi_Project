
{% extends "base.html" %}

{% block content %}

<style>
    .login-wrapper {
        min-height: 80vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 30px 15px;
    }

    .login-card {
        width: 100%;
        max-width: 440px;
        padding: 40px;
        background: #ffffff;
        border: 1px solid #e8edf4;
        border-radius: 20px;
        box-shadow: 0 15px 45px rgba(15, 23, 42, 0.09);
    }

    .login-logo {
        width: 65px;
        height: 65px;
        margin: 0 auto 20px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, #2563eb, #4f46e5);
        border-radius: 18px;
        color: white;
    }

    .login-title {
        text-align: center;
        font-size: 28px;
        font-weight: 700;
        color: #0f172a;
        margin-bottom: 8px;
    }

    .login-subtitle {
        text-align: center;
        color: #64748b;
        font-size: 14px;
        margin-bottom: 30px;
    }

    .login-card label {
        display: block;
        font-size: 14px;
        font-weight: 600;
        color: #334155;
        margin-bottom: 8px;
    }

    .login-card .form-control {
        min-height: 50px;
        padding: 12px 15px;
        border: 1px solid #dbe2ea;
        border-radius: 10px;
        font-size: 14px;
        background: #f8fafc;
        transition: all 0.2s ease;
    }

    .login-card .form-control:focus {
        background: #ffffff;
        border-color: #2563eb;
        box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.1);
    }

    .password-wrapper {
        position: relative;
    }

    .password-wrapper .form-control {
        padding-right: 50px;
    }

    .password-toggle {
        position: absolute;
        right: 15px;
        top: 50%;
        transform: translateY(-50%);
        background: transparent;
        border: none;
        color: #64748b;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 3px;
    }

    .password-toggle:hover {
        color: #2563eb;
    }

    .login-button {
        width: 100%;
        padding: 13px;
        margin-top: 10px;
        border: none;
        border-radius: 10px;
        background: linear-gradient(135deg, #2563eb, #4f46e5);
        color: white;
        font-size: 15px;
        font-weight: 600;
        transition: all 0.2s ease;
    }

    .login-button:hover {
        background: linear-gradient(135deg, #1d4ed8, #4338ca);
        transform: translateY(-2px);
        box-shadow: 0 6px 18px rgba(37, 99, 235, 0.2);
    }

    .login-footer {
        margin-top: 25px;
        padding-top: 20px;
        border-top: 1px solid #e8edf4;
        text-align: center;
        font-size: 13px;
        color: #64748b;
    }

    @media (max-width: 480px) {
        .login-card {
            padding: 28px 22px;
        }

        .login-title {
            font-size: 24px;
        }
    }
</style>

<div class="login-wrapper">

    <div class="login-card">

        <div class="login-logo">
            <svg width="30" height="30" viewBox="0 0 24 24"
                 fill="none" stroke="currentColor"
                 stroke-width="1.8" stroke-linecap="round"
                 stroke-linejoin="round">
                <rect x="3" y="5" width="18" height="16" rx="2"/>
                <path d="M16 3v4M8 3v4M3 10h18"/>
                <path d="m9 15 2 2 4-4"/>
            </svg>
        </div>

        <h2 class="login-title">Welcome Back</h2>

        <p class="login-subtitle">
            Sign in to your EventSphere account
        </p>

        <form method="post" action="/login">

            <input type="hidden"
                   name="csrf_token"
                   value="{{ csrf_token }}">

            <label for="email">Email Address</label>

            <input type="email"
                   id="email"
                   name="email"
                   class="form-control mb-4"
                   placeholder="Enter your email address"
                   required>

            <label for="password">Password</label>

            <div class="password-wrapper mb-3">

                <input type="password"
                       id="password"
                       name="password"
                       class="form-control"
                       placeholder="Enter your password"
                       required>

                <button type="button"
                        class="password-toggle"
                        id="passwordToggle"
                        onclick="togglePassword()"
                        aria-label="Show password">

                    <svg id="eyeIcon"
                         width="21"
                         height="21"
                         viewBox="0 0 24 24"
                         fill="none"
                         stroke="currentColor"
                         stroke-width="1.8"
                         stroke-linecap="round"
                         stroke-linejoin="round">

                        <path d="M2 12s3.5-7 10-7 10 7 10 7
                                 -3.5 7-10 7S2 12 2 12z"/>

                        <circle cx="12" cy="12" r="3"/>

                        <line id="eyeSlash"
                              x1="3" y1="3"
                              x2="21" y2="21"
                              style="display: none"/>

                    </svg>

                </button>

            </div>

            <button type="submit" class="login-button">
                Sign In &rarr;
            </button>

        </form>

        <div class="login-footer">
            Secure access to your EventSphere account
        </div>

    </div>

</div>

<script>
    function togglePassword() {
        const password = document.getElementById("password");
        const eyeSlash = document.getElementById("eyeSlash");
        const toggle = document.getElementById("passwordToggle");

        if (password.type === "password") {
            password.type = "text";
            eyeSlash.style.display = "block";
            toggle.setAttribute("aria-label", "Hide password");
        } else {
            password.type = "password";
            eyeSlash.style.display = "none";
            toggle.setAttribute("aria-label", "Show password");
        }
    }
</script>

{% endblock %}
