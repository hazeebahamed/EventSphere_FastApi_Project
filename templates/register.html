
{% extends "base.html" %}

{% block content %}

<style>
    .register-wrapper {
        min-height: 80vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 30px 15px;
    }

    .register-card {
        width: 100%;
        max-width: 440px;
        padding: 40px;
        background: #ffffff;
        border: 1px solid #e8edf4;
        border-radius: 20px;
        box-shadow: 0 15px 45px rgba(15, 23, 42, 0.09);
    }

    .register-logo {
        width: 65px;
        height: 65px;
        margin: 0 auto 20px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, #2563eb, #4f46e5);
        border-radius: 18px;
        color: white;
    }

    .register-title {
        text-align: center;
        font-size: 28px;
        font-weight: 700;
        color: #0f172a;
        margin-bottom: 8px;
    }

    .register-subtitle {
        text-align: center;
        color: #64748b;
        font-size: 14px;
        margin-bottom: 30px;
    }

    .register-card label {
        display: block;
        font-size: 14px;
        font-weight: 600;
        color: #334155;
        margin-bottom: 8px;
    }

    .register-card .form-control {
        min-height: 50px;
        padding: 12px 15px;
        border: 1px solid #dbe2ea;
        border-radius: 10px;
        font-size: 14px;
        background: #f8fafc;
        transition: all 0.2s ease;
    }

    .register-card .form-control:focus {
        background: #ffffff;
        border-color: #2563eb;
        box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.1);
    }

    .register-password-wrapper {
        position: relative;
    }

    .register-password-wrapper .form-control {
        padding-right: 50px;
    }

    .register-password-toggle {
        position: absolute;
        right: 15px;
        top: 50%;
        transform: translateY(-50%);
        background: transparent;
        border: none;
        color: #64748b;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 3px;
    }

    .register-password-toggle:hover {
        color: #2563eb;
    }

    .password-hint {
        font-size: 12px;
        color: #64748b;
        margin-top: 8px;
        margin-bottom: 20px;
    }

    .register-button {
        width: 100%;
        padding: 13px;
        margin-top: 10px;
        border: none;
        border-radius: 10px;
        background: linear-gradient(135deg, #2563eb, #4f46e5);
        color: white;
        font-size: 15px;
        font-weight: 600;
        transition: all 0.2s ease;
    }

    .register-button:hover {
        background: linear-gradient(135deg, #1d4ed8, #4338ca);
        transform: translateY(-2px);
        box-shadow: 0 6px 18px rgba(37, 99, 235, 0.2);
    }

    .register-footer {
        margin-top: 25px;
        padding-top: 20px;
        border-top: 1px solid #e8edf4;
        text-align: center;
        font-size: 13px;
        color: #64748b;
    }

    .register-footer a {
        color: #2563eb;
        font-weight: 600;
        text-decoration: none;
    }

    .register-footer a:hover {
        text-decoration: underline;
    }

    @media (max-width: 480px) {
        .register-card {
            padding: 28px 22px;
        }

        .register-title {
            font-size: 24px;
        }
    }
</style>

<div class="register-wrapper">

    <div class="register-card">

        <div class="register-logo">

            <svg width="30" height="30"
                 viewBox="0 0 24 24"
                 fill="none"
                 stroke="currentColor"
                 stroke-width="1.8"
                 stroke-linecap="round"
                 stroke-linejoin="round">

                <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/>

                <circle cx="9" cy="7" r="4"/>

                <path d="M19 8v6M22 11h-6"/>

            </svg>

        </div>

        <h2 class="register-title">Create Account</h2>

        <p class="register-subtitle">
            Join EventSphere and discover exciting events
        </p>

        <form method="post" action="/register">

            <input type="hidden"
                   name="csrf_token"
                   value="{{ csrf_token }}">

            <label for="name">Full Name</label>

            <input type="text"
                   id="name"
                   name="name"
                   class="form-control mb-4"
                   placeholder="Enter your full name"
                   autocomplete="name"
                   required>

            <label for="email">Email Address</label>

            <input type="email"
                   id="email"
                   name="email"
                   class="form-control mb-4"
                   placeholder="Enter your email address"
                   autocomplete="email"
                   required>

            <label for="password">Password</label>

            <div class="register-password-wrapper">

                <input type="password"
                       id="password"
                       name="password"
                       minlength="8"
                       class="form-control"
                       placeholder="Create a password"
                       autocomplete="new-password"
                       aria-describedby="passwordHint"
                       required>

                <button type="button"
                        class="register-password-toggle"
                        id="passwordToggle"
                        onclick="toggleRegisterPassword()"
                        aria-label="Show password">

                    <svg width="21"
                         height="21"
                         viewBox="0 0 24 24"
                         fill="none"
                         stroke="currentColor"
                         stroke-width="1.8"
                         stroke-linecap="round"
                         stroke-linejoin="round">

                        <path d="M2 12s3.5-7 10-7 10 7 10 7
                                 -3.5 7-10 7S2 12 2 12z"/>

                        <circle cx="12" cy="12" r="3"/>

                        <line id="eyeSlash"
                              x1="3" y1="3"
                              x2="21" y2="21"
                              style="display: none"/>

                    </svg>

                </button>

            </div>

            <p class="password-hint" id="passwordHint">
                Password must contain at least 8 characters.
            </p>

            <button type="submit" class="register-button">
                Create Account &rarr;
            </button>

        </form>

        <div class="register-footer">

            Already have an account?

            <a href="/login">Sign In</a>

        </div>

    </div>

</div>

<script>
    function toggleRegisterPassword() {

        const password = document.getElementById("password");
        const eyeSlash = document.getElementById("eyeSlash");
        const toggle = document.getElementById("passwordToggle");

        if (password.type === "password") {

            password.type = "text";
            eyeSlash.style.display = "block";
            toggle.setAttribute("aria-label", "Hide password");

        } else {

            password.type = "password";
            eyeSlash.style.display = "none";
            toggle.setAttribute("aria-label", "Show password");

        }
    }
</script>

{% endblock %}
