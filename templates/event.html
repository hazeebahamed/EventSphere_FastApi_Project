{% extends "base.html" %}

{% block content %}

<h1>{{ event.title }}</h1>

<p>{{ event.description }}</p>

<p>{{ event.start_time }}</p>

{% for category in categories %}

<div class="card p-3 mb-3">

    <h4>{{ category.name }}</h4>

    <p>Price: LKR {{ category.price }}</p>

    <p>
        Available:
        {{ category.quantity - category.sold - category.held }}
    </p>

    <form method="post" action="/book">

        <input type="hidden"
               name="csrf_token"
               value="{{ csrf_token }}">

        <input type="hidden"
               name="category_id"
               value="{{ category.id }}">

        <input type="number"
               name="quantity"
               min="1"
               max="6"
               value="1"
               class="form-control mb-3"
               required>

        <button class="btn btn-success">
            Simulate Payment and Book
        </button>

    </form>

</div>

{% endfor %}

{% endblock %}
